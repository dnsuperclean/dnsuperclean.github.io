    <g fill="#BFE9FF">
      <path d="M334,300 C340,322 350,332 372,338 C350,344 340,354 334,376 C328,354 318,344 296,338 C318,332 328,322 334,300 Z"/>
      <path d="M296,396 C300,410 306,416 320,420 C306,424 300,430 296,444 C292,430 286,424 272,420 C286,416 292,410 296,396 Z" opacity=".9"/>
