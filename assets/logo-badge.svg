      <stop offset="100%" stop-color="#181147"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#BFD4E8"/>
      <stop offset="100%" stop-color="#8FA6C0"/>
    </linearGradient>
    <linearGradient id="bBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9E2FF"/>
      <stop offset="45%" stop-color="#4FB8F2"/>
      <stop offset="100%" stop-color="#1568C2"/>
    </linearGradient>
    <linearGradient id="bGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C6E86A"/>
      <stop offset="50%" stop-color="#8DC63F"/>
      <stop offset="100%" stop-color="#5E9420"/>
    </linearGradient>
    <linearGradient id="bGold" x1="0" y1="0" x2="0" y2="1">
